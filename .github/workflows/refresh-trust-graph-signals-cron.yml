name: Refresh Trust Graph Signals

on:
  schedule:
    # Daily at 10:30 UTC. Interleaves with claim-expire and proposal-timeout crons.
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit refresh-trust-graph-signals worker
        run: |
          curl -fsS \
            --max-time 65 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/refresh-trust-graph-signals"
