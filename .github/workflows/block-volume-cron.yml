name: Block Volume Check

on:
  schedule:
    # Daily at 09:45 UTC — interleaves with claim-expire and proposal-timeout crons.
    - cron: '45 9 * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit block-volume-check worker
        run: |
          curl -fsS \
            --max-time 65 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/block-volume-check"
