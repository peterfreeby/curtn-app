name: Proposal Timeout Check

on:
  schedule:
    # Daily at 09:30 UTC. Cadence chosen to interleave with the claim-expire cron.
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit proposal-timeout-check worker
        run: |
          curl -fsS \
            --max-time 65 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/proposal-timeout-check"
