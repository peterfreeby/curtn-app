"""A single showing/performance instance"""
type Performance implements Node {
  """The ID of an object"""
  id: ID!
  run: Run
  date: String
  time: String
  venue: Venue

  """Stage override for this specific performance (if different from run)"""
  stageOverride: Stage

  """Resolved stage: performance override > run default"""
  effectiveStage: Stage
  ticketUrl: String
  soldOut: Boolean
  imageUrl: String

  """Resolved poster: performance override > run poster > show poster"""
  effectivePosterUrl: String

  """Resolved description: performance override > run > show"""
  effectiveDescription: String

  """Cast with per-performance overrides applied"""
  effectiveCast: [Credit]

  """Crew with per-performance overrides applied"""
  effectiveCrew: [Credit]
  createdAt: String
  updatedAt: String
}

"""An object with an ID"""
interface Node {
  """The id of the object."""
  id: ID!
}

"""
A specific production of a Show by a Company at a Venue during a time window
"""
type Run implements Node {
  """The ID of an object"""
  id: ID!

  """
  Run-specific title (e.g. "Inwood Shakespeare Festival's Annual: King Lear")
  """
  title: String

  """Run title if set, otherwise falls back to show title"""
  effectiveTitle: String!
  show: Show!
  productionCompany: ProductionCompany
  venues: [Venue]!
  stage: Stage
  intermissions: Int

  """
  When true, this run has a different lineup each performance (recurring showcase / comedy night). The aggregate run cast is empty by design; each performance carries its own cast via effectiveCast.
  """
  lineupPerPerformance: Boolean
  startDate: String
  endDate: String
  description: String
  imageUrl: String
  posterUrl: String
  wikidataId: String
  eventbriteId: String
  verificationStatus: String

  """All showings in this run"""
  performances(
    """Returns the items in the list that come after the specified cursor."""
    after: String

    """Returns the first n items from the list."""
    first: Int

    """Returns the items in the list that come before the specified cursor."""
    before: String

    """Returns the last n items from the list."""
    last: Int
  ): PerformanceConnection

  """Future showings only"""
  upcomingPerformances(
    """Returns the items in the list that come after the specified cursor."""
    after: String

    """Returns the first n items from the list."""
    first: Int

    """Returns the items in the list that come before the specified cursor."""
    before: String

    """Returns the last n items from the list."""
    last: Int
  ): PerformanceConnection
  cast: [Credit]
  crew: [Credit]
  averageRating: Float
  reviewCount: Int

  """Whether the current viewer has logged this run (via Seen or Review)"""
  viewerHasSeen: Boolean

  """Total users who have seen this run (Seen + unique Review users)"""
  totalAttendees: Int
  createdAt: String
  updatedAt: String
}

"""An intellectual work (e.g. "Hamilton", "Rejected Shorts")"""
type Show implements Node {
  """The ID of an object"""
  id: ID!
  title: String!
  description: String!
  performanceTypes: [String]!
  duration: Int!
  languages: [String]
  url: String
  imageUrl: String
  posterUrl: String
  wikidataId: String
  verificationStatus: String

  """All production runs of this show"""
  runs(
    """Returns the items in the list that come after the specified cursor."""
    after: String

    """Returns the first n items from the list."""
    first: Int

    """Returns the items in the list that come before the specified cursor."""
    before: String

    """Returns the last n items from the list."""
    last: Int
  ): RunConnection
  averageRating: Float
  reviewCount: Int
  watchlistCount: Int
  isOnMyWatchlist: Boolean

  """Whether the current viewer has seen any run of this show"""
  viewerHasSeen: Boolean

  """Show-level credits (playwrights, composers, etc.)"""
  creators(
    """Returns the items in the list that come after the specified cursor."""
    after: String

    """Returns the first n items from the list."""
    first: Int

    """Returns the items in the list that come before the specified cursor."""
    before: String

    """Returns the last n items from the list."""
    last: Int
  ): ShowCreditConnection

  """
  Deduped cast members that have a headshot, across all runs (top-billed first). Feeds the Mondrian fallback poster used when a show has no poster art.
  """
  castHeadshots: [Person]
  source: DataSource
  createdAt: String
  updatedAt: String
}

"""A connection to a list of items."""
type RunConnection {
  """Information to aid in pagination."""
  pageInfo: PageInfo!

  """A list of edges."""
  edges: [RunEdge]
}

"""Information about pagination in a connection."""
type PageInfo {
  """When paginating forwards, are there more items?"""
  hasNextPage: Boolean!

  """When paginating backwards, are there more items?"""
  hasPreviousPage: Boolean!

  """When paginating backwards, the cursor to continue."""
  startCursor: String

  """When paginating forwards, the cursor to continue."""
  endCursor: String
}

"""An edge in a connection."""
type RunEdge {
  """The item at the end of the edge"""
  node: Run

  """A cursor for use in pagination"""
  cursor: String!
}

"""A connection to a list of items."""
type ShowCreditConnection {
  """Information to aid in pagination."""
  pageInfo: PageInfo!

  """A list of edges."""
  edges: [ShowCreditEdge]
}

"""An edge in a connection."""
type ShowCreditEdge {
  """The item at the end of the edge"""
  node: ShowCredit

  """A cursor for use in pagination"""
  cursor: String!
}

"""
A credit linking a person to a show (e.g. playwright, composer, lyricist)
"""
type ShowCredit implements Node {
  """The ID of an object"""
  id: ID!
  person: Person!
  show: Show!
  role: String!
  order: Int
  createdAt: String
  updatedAt: String
}

"""A cast or crew member"""
type Person implements Node {
  """The ID of an object"""
  id: ID!
  name: String!
  slug: String!
  bio: String
  headshotUrl: String
  wikidataId: String
  castCredits: [Credit]
  crewCredits: [Credit]

  """Show-level credits (e.g. playwright, composer, lyricist)"""
  showCredits: [ShowCredit]

  """Unique companies this person has worked with"""
  productionCompanies: [ProductionCompany]

  """Linked User account (if this person has claimed a profile)"""
  user: User

  """Whether this person has been claimed by a user"""
  isClaimed: Boolean
  createdAt: String
  updatedAt: String

  """Whether the current viewer follows this entity"""
  isFollowedByViewer: Boolean

  """
  Claim ownership state: unclaimed | provisionally-claimed | claimed-passive | claimed-synced
  """
  claimState: String!

  """User who has claimed this unit (null when unclaimed/provisional)"""
  claimedBy: User

  """When the claim was approved (ISO string)"""
  claimedAt: String

  """
  Sync feed health (healthy | stale); only meaningful when claimState is claimed-synced
  """
  syncHealth: String

  """When the claimant connected a sync source (ISO string)"""
  syncSourceConnectedAt: String

  """Most recent claimant activity timestamp (for auto-expire; ISO string)"""
  lastClaimantActivityAt: String
}

"""A cast or crew credit linking a person to a run"""
type Credit {
  """The ID of an object"""
  id: ID!
  person: Person!
  run: Run!
  creditType: String!
  role: String!
  order: Int
  createdAt: String
}

"""A production company or theater troupe"""
type ProductionCompany implements Node {
