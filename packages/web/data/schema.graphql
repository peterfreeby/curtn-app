"""The root mutation type"""
type Mutation {
  """Verify a Firebase ID token from phone auth. Finds or creates the user."""
  authenticateWithPhone(input: authenticateWithPhoneInput!): authenticateWithPhonePayload

  """
  Complete onboarding by setting username and full name. Requires authentication.
  """
  createProfile(input: createProfileInput!): createProfilePayload

  """Update the authenticated user's profile"""
  userUpdate(input: userUpdateInput!): userUpdatePayload

  """Update the current user's profile details"""
  userProfileUpdate(input: userProfileUpdateInput!): userProfileUpdatePayload

  """Delete a user using its id"""
  userDelete(input: userDeleteInput!): userDeletePayload

  """
  Deprecated — use submitClaimRequest instead. Claims now require admin approval.
  """
  userClaimPerson(input: userClaimPersonInput!): userClaimPersonPayload

  """Unlink the current user from their claimed Person entity"""
  userUnclaimPerson(input: userUnclaimPersonInput!): userUnclaimPersonPayload

  """Break the link between a User and a Person (admin only)"""
  adminUnclaimPerson(input: adminUnclaimPersonInput!): adminUnclaimPersonPayload

  """Bumps activity timestamp on all of the current user's claimed units."""
  pingDashboardActivity(input: pingDashboardActivityInput!): pingDashboardActivityPayload

  """Add a comment"""
  commentCreate(input: commentCreateInput!): commentCreatePayload

  """Update a comment using its id"""
  commentUpdate(input: commentUpdateInput!): commentUpdatePayload

  """Delete a comment using its id"""
  commentDelete(input: commentDeleteInput!): commentDeletePayload

  """Add a review"""
  reviewCreate(input: reviewCreateInput!): reviewCreatePayload

  """Update a review using its id"""
  reviewUpdate(input: reviewUpdateInput!): reviewUpdatePayload

  """Delete a review using its id"""
  reviewDelete(input: reviewDeleteInput!): reviewDeletePayload

  """Toggle follow/unfollow a user"""
  followToggle(input: followToggleInput!): followTogglePayload

  """Add a credit (cast/crew) to a run"""
  creditAdd(input: creditAddInput!): creditAddPayload

  """Remove a credit from a run"""
  creditRemove(input: creditRemoveInput!): creditRemovePayload

  """Create a credit linking a person to a show (e.g. Playwright, Composer)"""
  showCreditCreate(input: showCreditCreateInput!): showCreditCreatePayload

  """
  Create a credit linking a production company to a show (e.g. Rights Holder, Original Producer, Licensor)
  """
  showCompanyCreditCreate(input: showCompanyCreditCreateInput!): showCompanyCreditCreatePayload

  """Create a new production company"""
  productionCompanyCreate(input: productionCompanyCreateInput!): productionCompanyCreatePayload

  """Update an existing production company (admin or claimant)"""
  productionCompanyUpdate(input: productionCompanyUpdateInput!): productionCompanyUpdatePayload

  """Find an existing show by title or create a new one"""
  showFindOrCreate(input: showFindOrCreateInput!): showFindOrCreatePayload

  """Update an existing show (admin only)"""
  showUpdate(input: showUpdateInput!): showUpdatePayload

  """
  Delete a show and all its runs, performances, credits, reviews (admin only)
  """
  showDelete(input: showDeleteInput!): showDeletePayload

  """
  Merge source show into target show. Reassigns all runs, deletes source (admin only)
  """
  showMerge(input: showMergeInput!): showMergePayload

  """
  Find an existing run by show (+ optional production company), or create a new one
  """
  runFindOrCreate(input: runFindOrCreateInput!): runFindOrCreatePayload

  """Update an existing run (admin only)"""
  runUpdate(input: runUpdateInput!): runUpdatePayload

  """Delete a run and all its performances, credits, reviews (admin only)"""
  runDelete(input: runDeleteInput!): runDeletePayload

  """
