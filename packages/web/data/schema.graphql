  error: String
  clientMutationId: String
}

input revokeTrustedEditorInput {
  trustedEditorId: String!
  clientMutationId: String
}

type acceptReciprocityPayload {
  trustedEditor: TrustedEditor
  error: String
  clientMutationId: String
}

input acceptReciprocityInput {
  originalTrustedEditorId: String!
  clientMutationId: String
}

type blockUserPayload {
  block: Block
  error: String
  clientMutationId: String
}

input blockUserInput {
  """Venue | ProductionCompany | Person"""
  scopedToKind: String!
  scopedToId: String!
  blockedUserId: String!

  """Private — admin-visible only."""
  reason: String
  clientMutationId: String
}

type unblockUserPayload {
  block: Block
  success: Boolean
  error: String
  clientMutationId: String
}

input unblockUserInput {
  blockId: String!
  clientMutationId: String
}

type entityFollowTogglePayload {
  isFollowing: Boolean
  error: String
  clientMutationId: String
}

input entityFollowToggleInput {
  """The kind of entity to follow/unfollow"""
  targetType: EntityFollowTargetType!

  """The global ID of the entity to follow/unfollow"""
  targetId: ID!
  clientMutationId: String
}

"""Kind of entity that can be followed"""
enum EntityFollowTargetType {
  venue
  person
  productionCompany
}