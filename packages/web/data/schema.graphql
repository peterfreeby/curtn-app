  """
  Pending proposals on units the authenticated user steward. Sorted newest first.
  """
  myPendingProposals(
    """Optional filter: "User" or "Scraper"."""
    authorType: String

    """
    Optional filter: Venue / ProductionCompany / Person / Performance / etc.
    """
    targetKind: String

    """Optional recency filter (proposals created in the last N days)."""
    sinceDays: Int
  ): [Proposal]

  """
  Pending proposals on unclaimed records from non-autoconfirmed users. Visible to admins + autoconfirmed users.
  """
