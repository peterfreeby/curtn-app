    """If true, only return lists where isActive is true"""
    activeOnly: Boolean

    """
    If provided, filter by exact active state (true = active, false = inactive)
    """
    isActive: Boolean
  ): ListConnection

  """
  Units (Venue, ProductionCompany, Person) currently claimed by the authenticated user.
  """
  myClaims: [MyClaim]

  """
  All claim requests the current user has submitted (across statuses, newest first).
  """
  myClaimRequests: [ClaimRequest]
  claimRequests(
    """Filter by status (pending, approved, rejected)"""
    status: String

    """Returns the items in the list that come after the specified cursor."""
    after: String

    """Returns the first n items from the list."""
    first: Int

    """Returns the items in the list that come before the specified cursor."""
    before: String

    """Returns the last n items from the list."""
    last: Int
  ): ClaimRequestConnection

  """The current user's most recent pending claim request, or null"""
