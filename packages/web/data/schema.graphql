  createdAt: String
  updatedAt: String

  """Whether the current viewer follows this entity"""
  isFollowedByViewer: Boolean

  """
  Claim ownership state: unclaimed | provisionally-claimed | claimed-passive | claimed-synced
  """
  claimState: String!

  """User who has claimed this unit (null when unclaimed/provisional)"""
  claimedBy: User

  """When the claim was approved (ISO string)"""
  claimedAt: String

  """
  Sync feed health (healthy | stale); only meaningful when claimState is claimed-synced
  """
  syncHealth: String

  """When the claimant connected a sync source (ISO string)"""
